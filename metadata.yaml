name: astrbot_plugin_denia_jupai
display_name: 今天你想为娅娅欢呼吗
desc: |
  自定义文字/图片的**举牌 GIF 表情**生成，四个角色：**娅娅**、**小爱（爱弥斯）**、**西西（Sigrika 西格莉卡）**，外加单发指令 **尤诺说 / 西西说**，
  编号含义完全相同：1眨眼 / 2红温 / 3开心 / 4悲伤 / 5期待 / 6哭哭。

  ## 用法
  - `娅娅举牌1 好想回来#粉` —— 只发编号用默认文字直接出图；**不带编号默认 1 号动作**
  - `小爱举牌1 来啦#粉` —— 小爱出镜，编号含义和写法与娅娅完全相同
  - `西西举牌 咕噜噜` —— 西西举牌1，默认文字「咕噜噜--」；`西西举牌2 点亮` 默认「点亮语乂」
  - `西西摸` / `西西展示` —— 引用一张图片再发指令，图片塞进圆形窗口跟着动
  - `西格莉卡举牌1~6` —— 西格莉卡（Sigrika）举牌，默认文案 咕噜噜/点亮语义/开心/悲伤/得意/哭哭，默认橙字
  - `尤诺说 月亮游离世间` / `西西说 再发找人弄你` —— 单图文字表情，不带文字用默认文案
  - 引用一张图片再发指令 —— 图片铺满牌面；指令后有文字→图上叠字，无文字→纯图上牌
  - 文字末尾 `#颜色` 换字色：`好想回来#粉`、`#e74c3c`；黑/粉/红/橙/黄/绿/深绿/青/蓝/深蓝/紫/金，旧写法 `-c 颜色` 也认
  - `举牌帮助` —— 渲染帮助卡片图片
  - 违禁词：群管理员/bot 主人发「添加违禁词 词1 词2 …」「删除违禁词 词」「违禁词列表」；面板插件设置里也可查看调整
  - 支持 emoji（🎉😤👍 等），随系统 emoji 字体彩色渲染

  文字贴在**粉色牌面**上、随牌摆动（逐帧刚体贴合标定位置），300×300 透明背景动图，无限循环。
  超长自动缩小字号，放不下会提示而不产烂图；单张生成不到 1 秒。

  群聊直接发即可，无需 @ 或唤醒前缀；@ 机器人和 `/` 前缀写法仍然兼容。
